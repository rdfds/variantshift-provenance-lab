[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "variantshift"
version = "1.0.0"
description = "Leakage-aware evaluation for protein variant-effect models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rohan Variankaval" }]
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.1",
  "scikit-learn>=1.6",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
plm = ["torch>=2.4", "fair-esm>=2.0.0"]
structure = [
  "fair-esm==2.0.0",
  "torch-geometric==2.6.1",
  "biotite==0.41.2",
  "torch-scatter==2.1.2",
]
workflow = [
  "snakemake>=8.0,<10",
  "snakemake-executor-plugin-slurm==2.5.4",
]
cloud = ["modal==1.2.6"]

[project.scripts]
variantshift = "variantshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
