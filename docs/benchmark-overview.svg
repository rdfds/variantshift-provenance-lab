<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">VariantShift generalization benchmark</title>
  <desc id="desc">The additive model's mean Spearman correlation falls from 0.77 on random variant splits to 0.40 on unseen positions and 0.68 at higher mutation depth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f2942"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".25"/></filter>
  </defs>
  <rect width="920" height="390" rx="24" fill="url(#bg)"/>
  <text x="54" y="52" fill="#5eead4" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="2">GENERALIZATION GAP</text>
  <text x="54" y="91" fill="#eef2ff" font-family="system-ui,sans-serif" font-size="28" font-weight="750">Additive mutation effects do not transfer equally.</text>
  <text x="54" y="120" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="15">Mean Spearman across TEV Sal10 and Sal25 EC50 targets</text>
  <line x1="62" y1="305" x2="858" y2="305" stroke="#334155"/>
  <line x1="62" y1="159" x2="858" y2="159" stroke="#243348" stroke-dasharray="4 6"/>
  <text x="49" y="310" fill="#64748b" text-anchor="end" font-family="system-ui" font-size="12">0.0</text>
  <text x="49" y="164" fill="#64748b" text-anchor="end" font-family="system-ui" font-size="12">0.8</text>
  <g filter="url(#shadow)">
    <rect x="128" y="164" width="160" height="141" rx="12" fill="#5eead4"/>
    <rect x="380" y="232" width="160" height="73" rx="12" fill="#fb7185"/>
    <rect x="632" y="181" width="160" height="124" rx="12" fill="#a78bfa"/>
  </g>
  <g font-family="system-ui,sans-serif" font-weight="750" font-size="24" text-anchor="middle" fill="#eef2ff">
    <text x="208" y="151">0.77</text><text x="460" y="219">0.40</text><text x="712" y="168">0.68</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="14" text-anchor="middle" fill="#cbd5e1">
    <text x="208" y="338">Random variant</text><text x="460" y="338">Unseen position</text><text x="712" y="338">Higher mutation depth</text>
  </g>
  <text x="460" y="372" fill="#64748b" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12">9,514 quality-filtered variants · deterministic seed 42</text>
</svg>
