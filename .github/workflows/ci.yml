name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=variantshift --cov-report=term-missing
      - name: Verify committed result artifacts
        run: |
          variantshift verify-artifacts results/run-manifest.json
          variantshift verify-artifacts results/proteingym/run-manifest.json
          variantshift verify-artifacts results/proteingym/extended/run-manifest.json
